name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  backend:
    name: Backend import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install bandit
      - name: Bandit security scan
        run: bandit -r app/ -x .venv -ll
      - name: Verify imports
        run: |
          python -c "
          from app import main;
          print('App loaded OK, routes:', len(main.app.routes), 'routes');
          "
        env:
          DATABASE_URL: sqlite:///ci-check.db
          SECRET_KEY: ci-secret-key
          ADMIN_USERNAME: test
          ADMIN_PASSWORD_HASH: test-hash
          CORS_ORIGINS: "*"
      # Guards the vercel.json wiring and the SPA static mount. The MIME bug
      # that blanked production shipped through both of these unnoticed.
      - run: pip install pytest httpx
      - name: pytest
        run: python -m pytest tests -q
        env:
          DATABASE_URL: sqlite:///ci-check.db
          SECRET_KEY: ci-secret-key
          ADMIN_USERNAME: test
          ADMIN_PASSWORD_HASH: test-hash
          CORS_ORIGINS: "*"

  data-json:
    name: Tarot data JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate tarot-cards.json
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('frontend/public/data/tarot-cards.json','utf8'));
          if (!Array.isArray(data) || data.length !== 78)
            throw new Error('Expected 78 cards, got ' + data.length);
          const ids = data.map(c => c.id);
          const unique = new Set(ids);
          if (unique.size !== 78)
            throw new Error('Duplicate ids: ' + (ids.length - unique.size));
          data.forEach((c, i) => {
            if (!c.id || !c.name || !c.img || !c.arcana || !c.meaning)
              throw new Error('Card ' + i + ' missing required fields: ' + JSON.stringify(c));
            if (!['Major','Minor'].includes(c.arcana))
              throw new Error('Card ' + c.id + ' invalid arcana: ' + c.arcana);
          });
          console.log('78 cards valid, no duplicates, all fields present');
          "
