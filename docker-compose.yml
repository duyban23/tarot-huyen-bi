services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarot_user
      POSTGRES_PASSWORD: tarot_pass
      POSTGRES_DB: tarot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarot_user -d tarot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://tarot_user:tarot_pass@postgres:5432/tarot_db
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
